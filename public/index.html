<!DOCTYPE html>
<html lang="es">
<head>

  <title>Innova Sourcing — Control de Producción</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --success: #059669;
      --success-light: #d1fae5;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --neutral: #6b7280;
      --neutral-light: #f3f4f6;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --pink: #ec4899;
      --pink-light: #fce7f3;
      --blue: #3b82f6;
      --blue-light: #dbeafe;
      --amber: #d97706;
      --amber-light: #fef3c7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    .header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header .season-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .deadline-bar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-light);
    }
    .deadline-bar .days-left { font-weight: 700; color: var(--warning); }

    .nav-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      overflow-x: auto;
    }
    .nav-tab {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .main { padding: 24px; max-width: 1500px; margin: 0 auto; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-light);
      font-weight: 600;
    }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .stat-card .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }

    .progress-bar-container { background: var(--neutral-light); border-radius: 8px; height: 8px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-input {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-input:focus { border-color: var(--primary); }
    select.filter-input { cursor: pointer; }

    .table-container {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--neutral-light);
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-light);
      white-space: nowrap;
      position: sticky;
      top: 0;
    }
    tbody td {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr:hover { background: #f9fafb; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-sin_asignar { background: var(--neutral-light); color: var(--neutral); }
    .badge-pendiente { background: var(--amber-light); color: var(--amber); }
    .badge-en_bordado { background: var(--blue-light); color: var(--blue); }
    .badge-entregado { background: var(--success-light); color: var(--success); }
    .badge-completado { background: var(--success-light); color: var(--success); }
    .badge-correccion { background: var(--danger-light); color: var(--danger); }
    .badge-listo_para_confeccion { background: var(--warning-light); color: var(--warning); }
    .badge-en_confeccion { background: var(--blue-light); color: var(--blue); }

      font-size: 11px;

    .editable {

    .editable input, .editable select {

      margin-right: 12px;

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {

      right: 24px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;

    .btn-primary-small {

    .btn-danger-small {

      font-size: 11px;
      font-family: inherit;
      border: 1px solid var(--danger-light);

    .assign-form {

      padding: 5px 8px;

      border-radius: 6px;

      font-family: inherit;

    .assign-form label {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 500;
    }
    .status-counters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-counter {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .assign-col { font-weight: 600; }
    .assign-col.full { color: var(--success); }
    .assign-col.partial { color: var(--warning); }
    .assign-col.none { color: var(--neutral); }

    .shipment-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-left: 4px;
    }
    .shipment-tag-ir { background: #dcfce7; color: #166534; }
    .shipment-tag-uk { background: #dbeafe; color: #1e40af; }

    .shipment-section {
      margin: 24px 0;
    }
    .shipment-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .shipment-card .shipment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .shipment-card .shipment-title {
      font-size: 15px;
      font-weight: 600;
    }
    .shipment-card .shipment-deadline {
      font-size: 12px;
      color: var(--text-light);
    }
    .shipment-progress-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 8px;
    }
    .shipment-progress-label {
      font-size: 12px;
      color: var(--text-light);
      min-width: 70px;
    }
    .shipment-progress-bar {
      flex: 1;
      background: var(--neutral-light);
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
    }
    .shipment-progress-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.5s ease;
    }
    .shipment-progress-pct {

    .shipment-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;

      margin-top: 4px;
    }
  </style>
</head>

<div class="header">
  <h1>INNOVA SOURCING</h1>
  <span class="season-badge" id="season-name">FW26-27</span>
</div>

<div class="deadline-bar">

  <span>•</span>

</div>

<div class="nav-tabs">
  <div class="nav-tab active" data-tab="dashboard">Dashboard</div>
  <div class="nav-tab" data-tab="bordado">Control Bordado</div>
  <div class="nav-tab" data-tab="confeccion">Control Confección</div>
  <div class="nav-tab" data-tab="productos">Productos</div>
</div>

<div class="main" id="content">
  <div class="loading"><div class="spinner"></div>Cargando datos...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rtnvpriddrizwelgxxcl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bnZwcmlkZHJpendlbGd4eGNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NTQxNDksImV4cCI6MjA5NTMzMDE0OX0.fTodjktkbane5Vk-U7vg3XToXTsNZCeCk7bfCj-X31I';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allItems = [];
let products = [];
let allAssignments = [];
let allShipments = [];
let allShipmentItems = [];
let currentTab = 'dashboard';
let filters = { search: '', gender: '', collection: '', status: '', shipment: '' };
let expandedItems = new Set();

async function init() {
  setupTabs();
  calculateDeadline();
  await loadData();
  render();
}

function calculateDeadline() {
  const deadline = new Date('2026-07-15');
  const today = new Date();
  const diff = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
  const el = document.getElementById('days-left');
  if (el) el.textContent = diff > 0 ? `${diff} días restantes` : 'Deadline pasado';
}

async function loadData() {
  const [itemsRes, productsRes, assignRes, shipmentsRes, shipItemsRes] = await Promise.all([
    sb.from('production_items').select('*, products(*)').order('id'),
    sb.from('products').select('*').order('collection'),
    sb.from('bordado_assignments').select('*').order('created_at'),
    sb.from('shipments').select('*').order('priority'),
    sb.from('shipment_items').select('*')
  ]);

  if (itemsRes.error) { console.error(itemsRes.error); return; }
  allItems = itemsRes.data || [];
  products = productsRes.data || [];
  allAssignments = assignRes.data || [];
  allShipments = shipmentsRes.data || [];
  allShipmentItems = shipItemsRes.data || [];
}

function setupTabs() {
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      filters = { search: '', gender: '', collection: '', status: '', shipment: '' };
      render();
    });
  });
}

function render() {
  const content = document.getElementById('content');
  switch (currentTab) {
    case 'dashboard': content.innerHTML = renderDashboard(); break;
    case 'bordado': content.innerHTML = renderBordado(); break;
    case 'confeccion': content.innerHTML = renderConfeccion(); break;
    case 'productos': content.innerHTML = renderProductos(); break;
  }
  attachListeners();
}

// === HELPERS ===
function getItemAssignments(itemId) {
  return allAssignments.filter(a => a.production_item_id === itemId);
}

function getItemBordadoInfo(item) {
  const assigns = getItemAssignments(item.id);
  const totalAssigned = assigns.reduce((s, a) => s + a.cantidad, 0);
  const pending = item.quantity - totalAssigned;

  let status = 'sin_asignar';
  if (assigns.length > 0) {
    const states = assigns.map(a => a.estado);
    if (states.every(s => s === 'entregado') && pending <= 0) {
      status = 'entregado';
    } else if (states.some(s => s === 'en_bordado')) {
      status = 'en_bordado';
    } else if (states.some(s => s === 'entregado') && !states.every(s => s === 'entregado')) {
      status = 'en_bordado';
    } else {
      status = 'pendiente';
    }
  }

  const bordadora = assigns.length === 1 ? assigns[0].bordadora : (assigns.length > 1 ? 'Varias' : '—');
  const fechaSalida = assigns.length === 1 ? assigns[0].fecha_salida : null;
  const fechaRetEst = assigns.length === 1 ? assigns[0].fecha_retorno_est : null;

  return { assigns, totalAssigned, pending, status, bordadora, fechaSalida, fechaRetEst };
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('es', { day: '2-digit', month: 'short' });
}

// === SHIPMENT HELPERS ===
// Get the quantity allocated to a specific shipment for a production_item
function getShipmentQty(itemId, shipmentId) {
  const si = allShipmentItems.find(s => s.production_item_id === itemId && s.shipment_id === shipmentId);
  return si ? si.quantity : 0;
}

// Get all shipment allocations for an item: [{shipment, qty}]
function getItemShipmentAllocations(item) {
  // Sort shipments by priority
  const sorted = [...allShipments].sort((a, b) => a.priority - b.priority);
  const allocations = [];
  let allocated = 0;

  for (const ship of sorted) {
    const explicitQty = getShipmentQty(item.id, ship.id);
    if (explicitQty > 0) {
      allocations.push({ shipment: ship, qty: explicitQty });
      allocated += explicitQty;
    }
  }

  // Remainder goes to the lowest-priority shipment that has no explicit allocation
  const remainder = item.quantity - allocated;
  if (remainder > 0) {
    // Find the shipment with no explicit items for this item (highest priority number = lowest priority)
    const remainderShip = sorted.find(s => !allShipmentItems.some(si => si.production_item_id === item.id && si.shipment_id === s.id));
    if (remainderShip) {
      allocations.push({ shipment: remainderShip, qty: remainder });
    }
  }

  return allocations;
}

// Calculate shipment progress using priority-based auto-fill
// For bordado: units with status entregado fill highest-priority shipment first
function getShipmentBordadoProgress(shipment) {
  let totalNeeded = 0;
  let totalDone = 0;

  allItems.forEach(item => {
    const allocations = getItemShipmentAllocations(item);
    const alloc = allocations.find(a => a.shipment.id === shipment.id);
    if (!alloc || alloc.qty === 0) return;

    totalNeeded += alloc.qty;

    // Calculate how many units of this item have bordado entregado
    const info = getItemBordadoInfo(item);
    const entregadoQty = info.assigns
      .filter(a => a.estado === 'entregado')
      .reduce((s, a) => s + a.cantidad, 0);

    // Priority-based fill: higher priority shipments eat first
    const sortedAllocs = allocations.sort((a, b) => a.shipment.priority - b.shipment.priority);
    let remaining = entregadoQty;
    for (const sa of sortedAllocs) {
      if (sa.shipment.id === shipment.id) {
        totalDone += Math.min(remaining, sa.qty);
        break;
      }
      remaining -= Math.min(remaining, sa.qty);
      if (remaining <= 0) break;
    }
  });

  return { totalNeeded, totalDone, pct: totalNeeded > 0 ? Math.round((totalDone / totalNeeded) * 100) : 0 };
}

// Calculate confección progress for a shipment (priority-based)
function getShipmentConfeccionProgress(shipment) {
  let totalNeeded = 0;
  let totalDone = 0;

  allItems.forEach(item => {
    const allocations = getItemShipmentAllocations(item);
    const alloc = allocations.find(a => a.shipment.id === shipment.id);
    if (!alloc || alloc.qty === 0) return;

    totalNeeded += alloc.qty;

    // For confección, use sew_status === 'completado' and sew_ok
    if (item.sew_status === 'completado' && item.sew_ok) {
      // All units of this item are done — fill by priority
      const sortedAllocs = allocations.sort((a, b) => a.shipment.priority - b.shipment.priority);
      let remaining = item.quantity;
      for (const sa of sortedAllocs) {
        if (sa.shipment.id === shipment.id) {
          totalDone += Math.min(remaining, sa.qty);
          break;
        }
        remaining -= Math.min(remaining, sa.qty);
        if (remaining <= 0) break;
      }
    }
  });

  return { totalNeeded, totalDone, pct: totalNeeded > 0 ? Math.round((totalDone / totalNeeded) * 100) : 0 };
}

// Get shipment tags HTML for a production item
function getShipmentTags(item) {
  const allocations = getItemShipmentAllocations(item);
  return allocations.map(a => {
    const code = a.shipment.destination === 'Irlanda' ? 'IR' : 'UK';
    const cls = code === 'IR' ? 'shipment-tag-ir' : 'shipment-tag-uk';
    return `<span class="shipment-tag ${cls}" title="${a.shipment.name}: ${a.qty} uds">${code}:${a.qty}</span>`;
  }).join('');
}

// Check if an item belongs to a specific shipment
function itemBelongsToShipment(item, shipmentId) {
  const allocations = getItemShipmentAllocations(item);
  return allocations.some(a => a.shipment.id === parseInt(shipmentId) && a.qty > 0);
}

// === DASHBOARD ===
function renderDashboard() {
  const total = allItems.length;
  const totalQty = allItems.reduce((s, i) => s + i.quantity, 0);

  let embEntregado = 0, embEnBordado = 0, embPendiente = 0, embSinAsignar = 0;
  allItems.forEach(item => {
    const info = getItemBordadoInfo(item);
    if (info.status === 'entregado') embEntregado++;
    else if (info.status === 'en_bordado') embEnBordado++;
    else if (info.status === 'pendiente') embPendiente++;
    else embSinAsignar++;
  });

  const embEntregadoQty = allItems.filter(i => getItemBordadoInfo(i).status === 'entregado').reduce((s, i) => s + i.quantity, 0);
  const embPct = totalQty > 0 ? Math.round((embEntregadoQty / totalQty) * 100) : 0;

  const sewCompleted = allItems.filter(i => i.sew_status === 'completado');

// === BORDADO VIEW ===
function renderBordado() {

  let filtered = [...allItems];
  if (filters.search) {
    const s = filters.search.toLowerCase();
    filtered = filtered.filter(i =>
      i.products?.code?.toLowerCase().includes(s) ||
      i.products?.collection?.toLowerCase().includes(s) ||
      i.products?.garment?.toLowerCase().includes(s) ||
      getItemBordadoInfo(i).bordadora.toLowerCase().includes(s)
    );
  }
  if (filters.gender) filtered = filtered.filter(i => i.products?.gender === filters.gender);
  if (filters.collection) filtered = filtered.filter(i => i.products?.collection === filters.collection);
  if (filters.status) filtered = filtered.filter(i => getItemBordadoInfo(i).status === filters.status);
  if (filters.shipment) filtered = filtered.filter(i => itemBelongsToShipment(i, filters.shipment));

  // Status counters
  const counts = { sin_asignar: 0, pendiente: 0, en_bordado: 0, entregado: 0 };
  filtered.forEach(i => { const s = getItemBordadoInfo(i).status; counts[s]++; });

  return `

    <div class="filters">
      <input class="filter-input" type="text" placeholder="Buscar código, colección, bordadora..." id="filter-search" value="${filters.search}" style="width:260px;">
      <select class="filter-input" id="filter-gender">
        <option value="">Todos los géneros</option>
        <option value="Niña" ${filters.gender === 'Niña' ? 'selected' : ''}>Niña</option>
        <option value="Niño" ${filters.gender === 'Niño' ? 'selected' : ''}>Niño</option>
      </select>
      <select class="filter-input" id="filter-collection">
        <option value="">Todas las colecciones</option>
        ${collections.map(c => `<option value="${c}" ${filters.collection === c ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
      <select class="filter-input" id="filter-status">
        <option value="">Todos los estados</option>
        ${statuses.map(s => `<option value="${s}" ${filters.status === s ? 'selected' : ''}>${statusLabels[s]}</option>`).join('')}
      </select>
      ${allShipments.length > 0 ? `
      <select class="filter-input" id="filter-shipment">
        <option value="">Todos los envíos</option>
        ${allShipments.map(s => `<option value="${s.id}" ${filters.shipment == s.id ? 'selected' : ''}>${s.destination === 'Irlanda' ? '🇮🇪' : '🇬🇧'} ${s.name}</option>`).join('')}
      </select>
      ` : ''}
      <span style="font-size:13px;color:var(--text-light);">${filtered.length} ítems</span>
    </div>

    <div style="margin-bottom:16px;" class="status-counters">
      <span class="status-counter badge-sin_asignar">Sin asignar ${counts.sin_asignar}</span>
      <span class="status-counter badge-pendiente">Pendiente ${counts.pendiente}</span>
      <span class="status-counter badge-en_bordado">En bordado ${counts.en_bordado}</span>
      <span class="status-counter badge-entregado">Entregado ${counts.entregado}</span>
    </div>

    <div class="table-container"><div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Código</th><th>Colección</th><th>Prenda</th><th>Talla</th><th>Cant.</th><th>Envío</th>
            <th>Asig.</th><th>Bordadora</th><th>Salida</th><th>Ret. Est.</th><th>Estado</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(item => {
            const info = getItemBordadoInfo(item);
            const isExpanded = expandedItems.has(item.id);

            let mainRow = `
            <tr class="item-row ${isExpanded ? 'expanded' : ''}" onclick="toggleRow(${item.id})">
              <td><span class="chevron">▶</span><strong>${item.products?.code || ''}</strong></td>
              <td>${item.products?.collection || ''}</td>
              <td>${item.products?.garment || ''}</td>
              <td>${item.size}</td>
              <td><strong>${item.quantity}</strong></td>
              <td>${getShipmentTags(item)}</td>
              <td><span class="assign-col ${assignClass}">${info.totalAssigned}/${item.quantity}</span></td>

              <td>${info.assigns.length === 1 ? fmtDate(info.fechaSalida) : '—'}</td>
              <td>${info.assigns.length === 1 ? fmtDate(info.fechaRetEst) : '—'}</td>
              <td><span class="badge badge-${info.status}">${statusLabels[info.status]}</span></td>

            <tr class="sub-row ${isExpanded ? 'visible' : ''}" id="sub-${item.id}">
              <td colspan="11">
                <div style="padding:8px 0 4px 20px;">
                  <div style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-light);letter-spacing:0.5px;margin-bottom:6px;">
                    Asignaciones
                  </div>
                  ${info.assigns.length > 0 ? `
                  <table class="sub-table">
                    <thead>
                      <tr><th>Bordadora</th><th>Cant.</th><th>Salida</th><th>Ret. Est.</th><th>Ret. Real</th><th>Estado</th><th></th></tr>
                    </thead>

                      ${info.assigns.map(a => `
                      <tr>
                        <td>
                          <span class="editable" onclick="event.stopPropagation();editAssignField(this,${a.id},'bordadora','text')">${a.bordadora}</span>
                        </td>
                        <td>
                          <span class="editable" onclick="event.stopPropagation();editAssignField(this,${a.id},'cantidad','number')">${a.cantidad}</span>
                        </td>
                        <td>
                          <span class="editable" onclick="event.stopPropagation();editAssignField(this,${a.id},'fecha_salida','date')">${fmtDate(a.fecha_salida)}</span>
                        </td>
                        <td>
                          <span class="editable" onclick="event.stopPropagation();editAssignField(this,${a.id},'fecha_retorno_est','date')">${fmtDate(a.fecha_retorno_est)}</span>
                        </td>
                        <td>
                          <span class="editable" onclick="event.stopPropagation();editAssignField(this,${a.id},'fecha_retorno_real','date')">${fmtDate(a.fecha_retorno_real)}</span>
                        </td>
                        <td>
                          <span class="editable" onclick="event.stopPropagation();editAssignStatus(this,${a.id},'${a.estado}')">
                            <span class="badge badge-${a.estado}">${statusLabels[a.estado] || a.estado}</span>

                        </td>
                        <td>
                          <button class="btn-danger-small" onclick="event.stopPropagation();deleteAssignment(${a.id})">✕</button>

                      `).join('')}

                  ` : '<div style="font-size:13px;color:var(--text-light);margin:4px 0;">Sin asignaciones todavía</div>'}

                  <div style="margin-top:8px;">
                    <button class="btn-small" onclick="event.stopPropagation();showAssignForm(${item.id}, ${item.quantity - info.totalAssigned})">+ Nueva asignación</button>
                  </div>
                </div>
              </td>
            </tr>`;

            return mainRow + subRow;
          }).join('')}
        </tbody>
      </table>
    </div></div>
  `;
}

function toggleRow(itemId) {
  if (expandedItems.has(itemId)) {
    expandedItems.delete(itemId);
  } else {
    expandedItems.add(itemId);
  }
  render();
}

function showAssignForm(itemId, maxQty) {
  const container = document.getElementById(`assign-form-${itemId}`);
  if (container.innerHTML) { container.innerHTML = ''; return; }
  const suggestedQty = maxQty > 0 ? maxQty : 1;
  container.innerHTML = `
    <div class="assign-form" onclick="event.stopPropagation()">
      <div><label>Bordadora</label><br><input type="text" id="af-bord-${itemId}" placeholder="Nombre" style="width:110px;"></div>
      <div><label>Cantidad</label><br><input type="number" id="af-qty-${itemId}" value="${suggestedQty}" min="1" style="width:60px;"></div>
      <div><label>F. Salida</label><br><input type="date" id="af-salida-${itemId}" style="width:130px;"></div>
      <div><label>F. Ret. Est.</label><br><input type="date" id="af-ret-${itemId}" style="width:130px;"></div>
      <div><label>Estado</label><br>
        <select id="af-estado-${itemId}" style="width:110px;">
          <option value="pendiente">Pendiente</option>
          <option value="en_bordado">En bordado</option>
        </select>
      </div>
      <div style="align-self:flex-end;">
        <button class="btn-primary-small" onclick="event.stopPropagation();saveNewAssignment(${itemId})">Guardar</button>
      </div>
    </div>
  `;
  document.getElementById(`af-bord-${itemId}`).focus();
}

async function saveNewAssignment(itemId) {
  const bordadora = document.getElementById(`af-bord-${itemId}`).value.trim();
  const cantidad = parseInt(document.getElementById(`af-qty-${itemId}`).value) || 0;
  const fecha_salida = document.getElementById(`af-salida-${itemId}`).value || null;
  const fecha_retorno_est = document.getElementById(`af-ret-${itemId}`).value || null;
  const estado = document.getElementById(`af-estado-${itemId}`).value;

  if (!bordadora) { showToast('Ingresa el nombre de la bordadora', 'error'); return; }
  if (cantidad <= 0) { showToast('La cantidad debe ser mayor a 0', 'error'); return; }

  const { error } = await sb.from('bordado_assignments').insert({
    production_item_id: itemId,
    bordadora,
    cantidad,
    fecha_salida,
    fecha_retorno_est,
    estado
  });

  if (error) {
    showToast('Error al guardar: ' + error.message, 'error');
    console.error(error);
  } else {
    showToast('Asignación creada');
    await loadData();
    render();
  }
}

async function editAssignField(el, assignId, field, type) {
  if (el.querySelector('input')) return;
  event.stopPropagation();
  const assign = allAssignments.find(a => a.id === assignId);
  const currentVal = assign ? assign[field] : '';
  const display = (currentVal === null || currentVal === undefined) ? '' : currentVal;

  el.innerHTML = `<input type="${type}" value="${display}"
    onclick="event.stopPropagation()"
    onblur="saveAssignField(this, ${assignId}, '${field}')"
    onkeydown="event.stopPropagation();if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.dataset.cancel='1';this.blur()}"
    style="width:${type === 'date' ? '130px' : (type === 'number' ? '50px' : '100px')}"
  >`;
  el.querySelector('input').focus();
}

async function saveAssignField(input, assignId, field) {
  if (input.dataset.cancel) { render(); return; }

  let value = input.value.trim();
  if (value === '') value = null;
  if (field === 'cantidad') value = value ? parseInt(value) : 1;

  const { error } = await sb.from('bordado_assignments').update({ [field]: value }).eq('id', assignId);
  if (error) {
    showToast('Error al guardar', 'error');
    console.error(error);
  } else {
    showToast('Guardado');
    const assign = allAssignments.find(a => a.id === assignId);
    if (assign) assign[field] = value;
  }
  render();
}

async function editAssignStatus(el, assignId, currentStatus) {
  if (el.querySelector('select')) return;
  event.stopPropagation();
  const options = ['pendiente', 'en_bordado', 'entregado'];
  const labels = { pendiente: 'Pendiente', en_bordado: 'En bordado', entregado: 'Entregado' };

  el.innerHTML = `<select
    onclick="event.stopPropagation()"
    onchange="saveAssignField(this, ${assignId}, 'estado')"
    onblur="saveAssignField(this, ${assignId}, 'estado')">
    ${options.map(o => `<option value="${o}" ${o === currentStatus ? 'selected' : ''}>${labels[o]}</option>`).join('')}
  </select>`;
  el.querySelector('select').focus();
}

async function deleteAssignment(assignId) {
  if (!confirm('¿Eliminar esta asignación?')) return;
  const { error } = await sb.from('bordado_assignments').delete().eq('id', assignId);
  if (error) {
    showToast('Error al eliminar', 'error');
  } else {
    showToast('Asignación eliminada');
    await loadData();
    render();
  }
}

        <thead>

            <th>Código</th><th>Colección</th><th>Prenda</th><th>Género</th><th>Talla</th><th>Cant.</th><th>Envío</th><th>Bordado OK</th>
            <th>Tipo</th><th>Asignadas</th><th>F. Inicio</th><th>F. Ent. Est.</th><th>F. Ent. Real</th><th>OK</th><th>Estado</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(item => {
            const embInfo = getItemBordadoInfo(item);
            const embOk = embInfo.status === 'entregado';
            return `
            <tr>
              <td><strong>${item.products?.code || ''}</strong></td>
              <td>${item.products?.collection || ''}</td>
              <td>${item.products?.garment || ''}</td>
              <td><span class="gender-badge gender-${item.products?.gender === 'Niña' ? 'nina' : 'nino'}">${item.products?.gender || ''}</span></td>
              <td>${item.size}</td>
              <td><strong>${item.quantity}</strong></td>
              <td>${getShipmentTags(item)}</td>
              <td>${embOk ? '✅' : '⬜'}</td>
              <td>
                <span class="editable" onclick="editField(this, ${item.id}, 'sewing_type', 'text')">${item.sewing_type || '—'}</span>
              </td>
              <td>
                <span class="editable" onclick="editField(this, ${item.id}, 'sew_qty_assigned', 'number')">${item.sew_qty_assigned || 0}</span>
              </td>
              <td>
                <span class="editable" onclick="editField(this, ${item.id}, 'sew_date_start', 'date')">${item.sew_date_start || '—'}</span>
              </td>
              <td>
                <span class="editable" onclick="editField(this, ${item.id}, 'sew_date_expected', 'date')">${item.sew_date_expected || '—'}</span>
              </td>
              <td>
                <span class="editable" onclick="editField(this, ${item.id}, 'sew_date_completed', 'date')">${item.sew_date_completed || '—'}</span>
              </td>
              <td>
                <span class="editable" onclick="toggleBool(${item.id}, 'sew_ok', ${item.sew_ok})">${item.sew_ok ? '✅' : '—'}</span>
              </td>
              <td>
                <span class="editable" onclick="editStatus(this, ${item.id}, 'sew_status', ['pendiente','listo_para_confeccion','en_confeccion','completado'])"
                ><span class="badge badge-${item.sew_status}">${statusLabels[item.sew_status] || item.sew_status}</span></span>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div></div>
  `;
}

// === PRODUCTOS VIEW ===
function renderProductos() {
  return `
    <h2 style="font-size:20px;margin-bottom:16px;">Catálogo de Productos</h2>
    <div class="filters">
      <input class="filter-input" type="text" placeholder="Buscar..." id="filter-search" value="${filters.search}" style="width:220px;">
    </div>
    <div class="table-container"><div class="table-scroll">
      <table>
        <thead>
          <tr><th>Código</th><th>Colección</th><th>Prenda</th><th>Descripción</th><th>Tela</th><th>Color</th><th>Género</th></tr>
        </thead>
        <tbody>
          ${products.filter(p => {
            if (!filters.search) return true;
            const s = filters.search.toLowerCase();
            return p.code.toLowerCase().includes(s) || p.collection.toLowerCase().includes(s) || p.garment.toLowerCase().includes(s);
          }).map(p => `
            <tr>
              <td><strong>${p.code}</strong></td>
              <td>${p.collection}</td>
              <td>${p.garment}</td>
              <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;">${p.description || ''}</td>
              <td>${p.fabric || ''}</td>
              <td>${p.color || ''}</td>
              <td><span class="gender-badge gender-${p.gender === 'Niña' ? 'nina' : 'nino'}">${p.gender}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div></div>
  `;
}

// === INLINE EDITING (production_items) ===
async function editField(el, itemId, field, type) {
  if (el.querySelector('input')) return;
  const currentVal = el.textContent.trim();
  const display = currentVal === '—' ? '' : currentVal;
  el.innerHTML = `<input type="${type}" value="${display}"
    onblur="saveField(this, ${itemId}, '${field}')"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.dataset.cancel='1';this.blur()}"
  >`;
  el.querySelector('input').focus();
}

async function saveField(input, itemId, field) {
  if (input.dataset.cancel) { await loadData(); render(); return; }
  let value = input.value.trim();
  if (value === '') value = null;
  if (field.includes('qty') || field.includes('assigned')) value = value ? parseInt(value) : 0;

  const { error } = await sb.from('production_items').update({ [field]: value }).eq('id', itemId);
  if (error) {
    showToast('Error al guardar', 'error');
    console.error(error);
  } else {
    showToast('Guardado');
    const item = allItems.find(i => i.id === itemId);
    if (item) item[field] = value;
  }
  render();
}

async function editStatus(el, itemId, field, options) {
  if (el.querySelector('select')) return;
  const labels = {
    sin_asignar: 'Sin asignar', en_bordado: 'En bordado', completado: 'Completado', correccion: 'Corrección',
    pendiente: 'Pendiente', listo_para_confeccion: 'Listo para confección', en_confeccion: 'En confección', entregado: 'Entregado'
  };
  const item = allItems.find(i => i.id === itemId);
  const current = item ? item[field] : '';

  el.innerHTML = `<select onchange="saveField(this, ${itemId}, '${field}')" onblur="saveField(this, ${itemId}, '${field}')">
    ${options.map(o => `<option value="${o}" ${o === current ? 'selected' : ''}>${labels[o] || o}</option>`).join('')}
  </select>`;
  el.querySelector('select').focus();
}

async function toggleBool(itemId, field, currentVal) {
  const newVal = !currentVal;
  const { error } = await sb.from('production_items').update({ [field]: newVal }).eq('id', itemId);
  if (error) {
    showToast('Error al guardar', 'error');
  } else {
    showToast(newVal ? 'Marcado como OK' : 'Desmarcado');
    const item = allItems.find(i => i.id === itemId);
    if (item) item[field] = newVal;
  }
  render();
}

// === FILTER LISTENERS ===
function attachListeners() {
  const searchEl = document.getElementById('filter-search');
  const genderEl = document.getElementById('filter-gender');
  const collectionEl = document.getElementById('filter-collection');
  const statusEl = document.getElementById('filter-status');
  const shipmentEl = document.getElementById('filter-shipment');

  if (searchEl) searchEl.addEventListener('input', (e) => { filters.search = e.target.value; render(); });
  if (genderEl) genderEl.addEventListener('change', (e) => { filters.gender = e.target.value; render(); });
  if (collectionEl) collectionEl.addEventListener('change', (e) => { filters.collection = e.target.value; render(); });
  if (statusEl) statusEl.addEventListener('change', (e) => { filters.status = e.target.value; render(); });
  if (shipmentEl) shipmentEl.addEventListener('change', (e) => { filters.shipment = e.target.value; render(); });
}

// === TOAST ===
function showToast(message, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// === START ===
init();
</script>
